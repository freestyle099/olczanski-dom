<section id="galeria" class="gallery">
  <div class="container">
    <h2 class="gallery__title heading-2">Galeria</h2>
    <div class="gallery__items">
      @for (image of images(); track image.src; let index = $index) {
        <div class="gallery__image-wrapper">
          <img class="gallery__image" [src]="image.src" [alt]="image.alt" (click)="openLightbox(index)" />
        </div>
      }
    </div>
  </div>
</section>
